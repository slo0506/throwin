name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  matcher:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/matcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  migrations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL 16 with pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-16 postgresql-16-pgvector
          sudo systemctl stop postgresql || true
      - name: Apply migrations, seed and SQL tests
        run: sudo PG_BIN=/usr/lib/postgresql/16/bin ./scripts/check-migrations.sh

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project apps/ios/ThrowIn.xcodeproj -scheme ThrowIn \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify || exit ${PIPESTATUS[0]}
